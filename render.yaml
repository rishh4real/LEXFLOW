services:
  - type: web
    name: lexflow-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: lexflow
      - key: ENVIRONMENT
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
